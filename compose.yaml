services:
  api:
    build:
      context: .  #- 使用当前目录 . 作为构建上下文；
      dockerfile: Dockerfile   #- 使用当前目录里的 Dockerfile 构建镜
#表示：




    image: agent-learning-api:latest #构建后的镜像命名为：agent-learning-api:latest
    container_name: agent-learning-container # 容器名称固定为：agent-learning-container

    ports:  #主机的 8000 端口 → 容器的 8000 端口
      - "127.0.0.1:${API_PORT:-8000}:8000"

    env_file:
      - .env

    volumes: #数据卷
      - agent-learning-data:/app/data
      #   external: true并且想明确使用这个现有数据卷，可以写：

    restart: unless-stopped

volumes:
  agent-learning-data:
    #  name: agent-learning-data 也可以固定实际名称：
  #restart: unless-stopped 自动重启 但如果你主动停止容器，它不会自动重新启动。


  #在 compose.yaml 所在目录执行：
  #docker compose up -d --build
  # docker compose down 关闭
